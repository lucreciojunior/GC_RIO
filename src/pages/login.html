<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Igreja RIO Gestão de Culto</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --verde-escuro: #14352a;
            --verde-medio: #2d6a4f;
            --verde-claro: #52b788;
            --verde-suave: #e6f4ec;
            --verde-bg: #0d2818;
            --branco: #ffffff;
            --cinza-fundo: #f4f6f5;
            --texto: #1f2a24;
            --radius: 18px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background:
                radial-gradient(1000px 500px at 50% -10%, #1e4d3a 0%, transparent 60%),
                linear-gradient(180deg, #0d2818 0%, #0a1f13 100%);
            background-attachment: fixed;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 18px calc(24px + env(safe-area-inset-bottom, 0));
            -webkit-font-smoothing: antialiased;
        }

        .login-container {
            width: 100%;
            max-width: 400px;
            text-align: center;
            animation: fadeUp 0.5s ease both;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo-section {
            margin-bottom: 30px;
        }

        .logo-circle {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            padding: 3px;
            background: linear-gradient(135deg, var(--verde-claro), var(--verde-medio));
            margin: 0 auto 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.35);
        }

        .logo-circle img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            background: var(--verde-escuro);
        }

        .logo-text {
            color: var(--branco);
            font-size: 1.5rem;
            font-weight: 600;
        }

        .logo-text span {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .logo-text .rio {
            color: var(--verde-claro);
            font-weight: 700;
            font-size: 1.9rem;
            letter-spacing: 0.04em;
        }

        .logo-subtitle {
            color: rgba(230, 244, 236, 0.7);
            font-size: 0.8rem;
            font-weight: 400;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-top: 6px;
        }

        .login-card {
            background: var(--branco);
            border-radius: var(--radius);
            padding: 32px 26px;
            box-shadow: 0 24px 60px rgba(0,0,0,0.35);
        }

        .login-card h2 {
            color: var(--verde-escuro);
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 16px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--verde-escuro);
            margin-bottom: 7px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--verde-medio);
            font-size: 0.95rem;
        }

        .form-group input {
            width: 100%;
            padding: 15px 16px 15px 46px;
            border: 1.5px solid var(--border-color, #e6eae8);
            border-radius: 12px;
            font-size: 16px;
            font-family: 'Inter', sans-serif;
            transition: all 0.25s ease;
            background: #fafbfa;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--verde-claro);
            box-shadow: 0 0 0 4px rgba(82, 183, 136, 0.15);
            background: var(--branco);
        }

        .btn-login {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, var(--verde-escuro), var(--verde-medio));
            color: var(--branco);
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            margin-top: 8px;
            font-family: 'Inter', sans-serif;
            min-height: 52px;
            box-shadow: 0 6px 18px rgba(45, 106, 79, 0.3);
        }

        .btn-login:active {
            transform: scale(0.98);
        }

        .error-msg {
            color: #d32f2f;
            font-size: 0.85rem;
            margin-top: 14px;
            display: none;
            font-weight: 500;
            background: #ffebee;
            padding: 10px 12px;
            border-radius: 10px;
        }

        .footer-text {
            color: rgba(255,255,255,0.4);
            font-size: 0.72rem;
            margin-top: 26px;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="logo-section">
            <div class="logo-circle">
                <img src="../../assets/images/aldeia.PNG" alt="Logo RIO" onerror="this.style.display='none'; this.parentElement.innerHTML='<span style=&quot;color:#52b788;font-size:2rem;font-weight:700&quot;>RIO</span>';">
            </div>
            <div class="logo-text">
                <span><span class="rio">RIO</span></span>
            </div>
            <div class="logo-subtitle">Gestão de Culto</div>
        </div>

        <div class="login-card">
            <h2><i class="fa-solid fa-lock" style="margin-right: 8px;"></i>Acesso ao Sistema</h2>

            <form id="loginForm" onsubmit="return fazerLogin(event)">
                <div class="form-group">
                    <label for="usuario">Usuário</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-user"></i>
                        <input type="text" id="usuario" placeholder="Digite seu usuário" required autocomplete="username">
                    </div>
                </div>

                <div class="form-group">
                    <label for="senha">Senha</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-key"></i>
                        <input type="password" id="senha" placeholder="Digite sua senha" required autocomplete="current-password">
                    </div>
                </div>

                <button type="submit" class="btn-login">
                    <i class="fa-solid fa-right-to-bracket" style="margin-right: 8px;"></i>Entrar
                </button>

                <p class="error-msg" id="errorMsg">Usuário ou senha incorretos.</p>
            </form>
        </div>

        <p class="footer-text">Igreja RIO - Relevante, Integral e Orgânico</p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../scripts/config.js?v=3"></script>
    <script src="../scripts/api.js?v=3"></script>
    <script>
        async function fazerLogin(event) {
            event.preventDefault();

            const usuario = document.getElementById('usuario').value.trim();
            const senha = document.getElementById('senha').value;
            const btn = document.querySelector('.btn-login');
            const errorMsg = document.getElementById('errorMsg');

            const textoOriginal = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Entrando...';
            errorMsg.style.display = 'none';

            try {
                await API.login(usuario, senha);
                window.location.href = 'home.html';
            } catch (erro) {
                errorMsg.textContent = erro.message || 'Usuário ou senha incorretos.';
                errorMsg.style.display = 'block';
                btn.disabled = false;
                btn.innerHTML = textoOriginal;
            }

            return false;
        }

        // Se já está logado, redireciona para a home
        (async function () {
            const { data: { session } } = await _sb.auth.getSession();
            if (session) {
                window.location.href = 'home.html';
            }
        })();
    </script>

</body>
</html>
