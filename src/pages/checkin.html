<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check-in - Igreja RIO</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/global.css">
    <style>
        body { background-color: var(--cinza-fundo); min-height: 100vh; }

        .data-hoje { text-align: center; color: var(--texto-muted); font-size: 0.9rem; margin-bottom: 16px; }
        .data-hoje strong { color: var(--verde-escuro); }

        .meu-checkin {
            background: linear-gradient(135deg, var(--verde-escuro), var(--verde-medio));
            color: #fff; border-radius: var(--radius); padding: 24px 20px;
            text-align: center; margin-bottom: 22px; box-shadow: 0 8px 24px rgba(20,53,42,0.2);
        }
        .meu-checkin h2 { color: #fff; font-size: 1.1rem; margin-bottom: 4px; }
        .meu-checkin p { color: var(--verde-suave); font-size: 0.85rem; margin-bottom: 16px; }
        .btn-checkin {
            width: 100%; border: none; border-radius: 12px; padding: 16px;
            font-size: 1rem; font-weight: 700; font-family: 'Inter', sans-serif; cursor: pointer;
            min-height: 54px; transition: transform 0.2s;
        }
        .btn-checkin:active { transform: scale(0.98); }
        .btn-checkin.marcar { background: #fff; color: var(--verde-escuro); }
        .btn-checkin.marcado { background: rgba(255,255,255,0.15); color: #fff; border: 1.5px solid rgba(255,255,255,0.4); }

        /* Abas */
        .tabs { display: flex; gap: 8px; margin-bottom: 16px; background: #fff; padding: 6px; border-radius: 12px; border: 1px solid var(--border-color); }
        .tab { flex: 1; text-align: center; padding: 10px; border-radius: 8px; font-size: 0.88rem; font-weight: 600; color: var(--texto-muted); cursor: pointer; border: none; background: none; font-family: 'Inter', sans-serif; }
        .tab.active { background: var(--verde-suave); color: var(--verde-medio); }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* Filtro igreja (admin) */
        .filtro-igreja { margin-bottom: 14px; }
        .filtro-igreja select {
            width: 100%; padding: 12px 14px; border: 1.5px solid var(--border-color);
            border-radius: 10px; font-size: 16px; font-family: 'Inter', sans-serif; background: #fff;
        }
        .filtro-data { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
        .filtro-data input { flex: 1; min-width: 130px; padding: 12px; border: 1.5px solid var(--border-color); border-radius: 10px; font-size: 16px; font-family: 'Inter', sans-serif; background: #fff; }

        .section-title { font-size: 1rem; font-weight: 700; color: var(--verde-escuro); margin: 18px 0 12px; display: flex; align-items: center; gap: 8px; }
        .contador { font-size: 0.78rem; color: var(--texto-muted); font-weight: 500; }

        .lista { display: flex; flex-direction: column; gap: 10px; }

        .servo-item {
            background: var(--branco); border: 1px solid var(--border-color); border-radius: 14px;
            padding: 12px 14px; display: flex; align-items: center; gap: 12px; box-shadow: var(--shadow-sm);
        }
        .servo-item .avatar {
            width: 42px; height: 42px; border-radius: 50%;
            background: linear-gradient(135deg, var(--verde-medio), var(--verde-claro));
            color: #fff; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
        }
        .servo-item.presente .avatar { background: linear-gradient(135deg, #25D366, #128C7E); }
        .servo-item .info { flex: 1; min-width: 0; }
        .servo-item .nome { font-weight: 600; color: var(--verde-escuro); }
        .servo-item .detalhe { font-size: 0.78rem; color: var(--texto-muted); }
        .servo-item .btn-toggle {
            border: none; border-radius: 999px; padding: 9px 16px; font-size: 0.82rem; font-weight: 600;
            cursor: pointer; font-family: 'Inter', sans-serif; flex-shrink: 0; min-height: 40px;
        }
        .btn-toggle.marcar { background: var(--verde-suave); color: var(--verde-medio); }
        .btn-toggle.presente { background: #25D366; color: #fff; }

        /* Histórico agrupado por data */
        .grupo-data { margin-bottom: 18px; }
        .grupo-data .cabecalho {
            font-weight: 700; color: var(--verde-escuro); font-size: 0.9rem;
            padding: 8px 4px; display: flex; justify-content: space-between; align-items: center;
        }
        .grupo-data .cabecalho .qtd { font-size: 0.75rem; color: #fff; background: var(--verde-medio); padding: 3px 10px; border-radius: 999px; }

        .empty { text-align: center; padding: 40px 20px; color: var(--texto-muted); }
        .empty i { font-size: 2.3rem; opacity: 0.35; margin-bottom: 10px; display: block; }

        .feedback { padding: 12px 16px; border-radius: 10px; font-size: 0.85rem; margin-bottom: 16px; display: none; }
        .feedback.show { display: flex; align-items: center; gap: 8px; }
        .feedback.success { background: var(--verde-suave); color: var(--verde-medio); }
        .feedback.error { background: var(--danger-light); color: var(--danger); }

        /* Estatísticas do histórico */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-bottom: 8px; }
        .stat {
            background: var(--branco); border: 1px solid var(--border-color); border-radius: 14px;
            padding: 14px; text-align: center; box-shadow: var(--shadow-sm);
        }
        .stat .valor { font-size: 1.6rem; font-weight: 800; color: var(--verde-escuro); line-height: 1; }
        .stat .rotulo { font-size: 0.72rem; color: var(--texto-muted); font-weight: 600; text-transform: uppercase; margin-top: 4px; letter-spacing: 0.3px; }
        .rank-badge { background: var(--verde-medio); color: #fff; font-weight: 700; }
    </style>
</head>
<body>

    <div class="rio-topbar">
        <div class="rio-topbar-left">
            <a href="home.html" class="btn-back"><i class="fa-solid fa-arrow-left"></i></a>
            <div class="topbar-title"><i class="fa-solid fa-user-check"></i> Check-in</div>
        </div>
        <div class="rio-topbar-right">
            <a href="home.html" class="btn-home"><i class="fa-solid fa-house"></i> <span>Início</span></a>
        </div>
    </div>

    <div class="rio-container">
        <div class="feedback" id="feedback"></div>
        <div class="data-hoje">Hoje é <strong id="dataHoje"></strong></div>

        <!-- Card do próprio check-in -->
        <div class="meu-checkin" id="meuCheckin" style="display:none;">
            <h2 id="meuNome">Você</h2>
            <p id="meuStatus">Marque presença que você está servindo hoje.</p>
            <button class="btn-checkin marcar" id="btnMeuCheckin">
                <i class="fa-solid fa-hand-point-up"></i> Fazer meu check-in
            </button>
        </div>

        <!-- Área de gestão (líder/admin) -->
        <div id="areaGestao" style="display:none;">
            <div class="tabs">
                <button class="tab active" data-tab="hoje" onclick="trocarAba('hoje')">Hoje</button>
                <button class="tab" data-tab="historico" onclick="trocarAba('historico')">Histórico</button>
            </div>

            <!-- Filtro de igreja (só admin) -->
            <div class="filtro-igreja" id="filtroIgrejaBox" style="display:none;">
                <select id="filtroIgreja"><option value="">Todas as igrejas</option></select>
            </div>

            <!-- ABA HOJE -->
            <div class="tab-content active" id="tab-hoje">
                <div class="section-title">
                    <i class="fa-solid fa-users"></i> Servos
                    <span class="contador" id="contador"></span>
                </div>
                <div class="lista" id="listaServos"></div>
                <div class="empty" id="emptyServos" style="display:none;">
                    <i class="fa-solid fa-users-slash"></i>
                    <p>Nenhum servo encontrado.</p>
                </div>
            </div>

            <!-- ABA HISTÓRICO -->
            <div class="tab-content" id="tab-historico">
                <div class="filtro-data">
                    <input type="date" id="histInicio" title="Data inicial">
                    <input type="date" id="histFim" title="Data final">
                </div>
                <!-- Resumo estatístico -->
                <div class="stats-grid" id="statsCheckin"></div>
                <!-- Ranking -->
                <div class="section-title"><i class="fa-solid fa-ranking-star"></i> Servos mais presentes</div>
                <div class="lista" id="rankingHist"></div>
                <div class="section-title" style="margin-top:20px;"><i class="fa-solid fa-clock-rotate-left"></i> Presenças por dia</div>
                <div id="listaHistorico"></div>
                <div class="empty" id="emptyHist" style="display:none;">
                    <i class="fa-solid fa-calendar-xmark"></i>
                    <p>Nenhum check-in no período.</p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../scripts/config.js?v=2"></script>
    <script src="../scripts/api.js?v=2"></script>
    <script>
        let sessao = null;
        let servos = [];
        let checkinsHoje = [];

        function feedback(msg, tipo) {
            const el = document.getElementById('feedback');
            el.className = `feedback show ${tipo}`;
            el.innerHTML = `<i class="fa-solid fa-${tipo === 'success' ? 'check-circle' : 'exclamation-circle'}"></i> ${msg}`;
            setTimeout(() => { el.className = 'feedback'; }, 4000);
        }

        function iniciais(nome) {
            const p = nome.trim().split(/\s+/);
            return ((p[0]?.[0] || '') + (p[1]?.[0] || '')).toUpperCase();
        }
        function checkinDoServo(id) { return checkinsHoje.find(c => c.servo_id === id); }
        function fmtData(iso) {
            const [a,m,d] = iso.split('-');
            return `${d}/${m}/${a}`;
        }

        function igrejaFiltro() {
            const sel = document.getElementById('filtroIgreja');
            return (sessao.perfil === 'admin' && sel && sel.value) ? sel.value : null;
        }

        function trocarAba(aba) {
            document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === aba));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.getElementById('tab-' + aba).classList.add('active');
            if (aba === 'historico') carregarHistorico();
        }

        // ---- Meu check-in ----
        function renderMeuCheckin() {
            const card = document.getElementById('meuCheckin');
            card.style.display = 'block';
            document.getElementById('meuNome').textContent = sessao.nome;
            const meu = checkinDoServo(sessao.id);
            const btn = document.getElementById('btnMeuCheckin');
            const status = document.getElementById('meuStatus');
            if (meu) {
                status.textContent = `Check-in feito às ${(meu.horario || '').slice(0,5)}. Deus abençoe seu serviço!`;
                btn.className = 'btn-checkin marcado';
                btn.innerHTML = '<i class="fa-solid fa-circle-check"></i> Presença confirmada — toque para desfazer';
                btn.onclick = () => desmarcar(meu.id);
            } else {
                status.textContent = 'Marque presença que você está servindo hoje.';
                btn.className = 'btn-checkin marcar';
                btn.innerHTML = '<i class="fa-solid fa-hand-point-up"></i> Fazer meu check-in';
                btn.onclick = marcarMeu;
            }
        }

        async function marcarMeu() {
            try {
                await API.marcarCheckin({ servo_id: sessao.id, servo_nome: sessao.nome, igreja: sessao.igreja });
                await recarregarHoje();
                feedback('Check-in realizado!', 'success');
            } catch (e) { feedback(e.message, 'error'); }
        }
        async function desmarcar(id) {
            if (!confirm('Desfazer este check-in?')) return;
            try {
                await API.desmarcarCheckin(id);
                await recarregarHoje();
                feedback('Check-in desfeito.', 'success');
            } catch (e) { feedback(e.message, 'error'); }
        }

        // ---- Gestão (líder/admin) ----
        function renderServos() {
            const filtro = igrejaFiltro();
            const lista = document.getElementById('listaServos');
            const empty = document.getElementById('emptyServos');

            let visiveis = servos;
            if (filtro) visiveis = servos.filter(s => s.igreja === filtro);

            document.getElementById('contador').textContent = `${checkinsHoje.length} presente(s)`;

            if (visiveis.length === 0) {
                lista.innerHTML = ''; empty.style.display = 'block'; return;
            }
            empty.style.display = 'none';
            lista.innerHTML = visiveis.map(s => {
                const c = checkinDoServo(s.id);
                const presente = !!c;
                return `
                    <div class="servo-item ${presente ? 'presente' : ''}">
                        <div class="avatar">${iniciais(s.nome)}</div>
                        <div class="info">
                            <div class="nome">${s.nome}</div>
                            <div class="detalhe">${s.igreja || '—'}${presente ? ' · ✓ ' + (c.horario||'').slice(0,5) : ''}</div>
                        </div>
                        <button class="btn-toggle ${presente ? 'presente' : 'marcar'}" onclick="toggleServo('${s.id}')">
                            ${presente ? 'Presente' : 'Marcar'}
                        </button>
                    </div>`;
            }).join('');
        }

        async function toggleServo(servoId) {
            const servo = servos.find(s => s.id === servoId);
            const c = checkinDoServo(servoId);
            try {
                if (c) await API.desmarcarCheckin(c.id);
                else await API.marcarCheckin({ servo_id: servo.id, servo_nome: servo.nome, igreja: servo.igreja });
                await recarregarHoje();
            } catch (e) { feedback(e.message, 'error'); }
        }

        async function recarregarHoje() {
            checkinsHoje = await API.listarCheckins(null, igrejaFiltro());
            renderMeuCheckin();
            if (sessao.perfil === 'admin' || sessao.perfil === 'lider') renderServos();
        }

        // ---- Histórico ----
        async function carregarHistorico() {
            const inicio = document.getElementById('histInicio').value || null;
            const fim = document.getElementById('histFim').value || null;
            let dados = [];
            try {
                dados = await API.historicoCheckins({ igreja: igrejaFiltro(), data_inicio: inicio, data_fim: fim });
            } catch (e) { feedback(e.message, 'error'); return; }

            const cont = document.getElementById('listaHistorico');
            const empty = document.getElementById('emptyHist');
            const stats = document.getElementById('statsCheckin');
            const rank = document.getElementById('rankingHist');

            if (dados.length === 0) {
                cont.innerHTML = ''; stats.innerHTML = ''; rank.innerHTML = '';
                empty.style.display = 'block'; return;
            }
            empty.style.display = 'none';

            // Estatísticas
            const datasUnicas = [...new Set(dados.map(c => c.data))];
            const servosUnicos = new Set(dados.map(c => c.servo_id)).size;
            const mediaDia = datasUnicas.length ? Math.round(dados.length / datasUnicas.length) : 0;
            stats.innerHTML = `
                <div class="stat"><div class="valor">${dados.length}</div><div class="rotulo">Check-ins</div></div>
                <div class="stat"><div class="valor">${servosUnicos}</div><div class="rotulo">Servos</div></div>
                <div class="stat"><div class="valor">${datasUnicas.length}</div><div class="rotulo">Dias</div></div>
                <div class="stat"><div class="valor">${mediaDia}</div><div class="rotulo">Média/dia</div></div>`;

            // Ranking de presença
            const contador = {};
            dados.forEach(c => {
                contador[c.servo_id] = contador[c.servo_id] || { nome: c.servo_nome, igreja: c.igreja, n: 0 };
                contador[c.servo_id].n++;
            });
            const ranking = Object.values(contador).sort((a,b) => b.n - a.n).slice(0, 10);
            rank.innerHTML = ranking.map((r, i) => `
                <div class="servo-item">
                    <div class="avatar rank-badge">${i + 1}º</div>
                    <div class="info">
                        <div class="nome">${r.nome}</div>
                        <div class="detalhe">${r.igreja}</div>
                    </div>
                    <button class="btn-toggle presente" style="pointer-events:none;">${r.n} presença${r.n>1?'s':''}</button>
                </div>`).join('');

            // Agrupa por data
            const grupos = {};
            dados.forEach(c => { (grupos[c.data] = grupos[c.data] || []).push(c); });

            cont.innerHTML = Object.keys(grupos).map(data => {
                const itens = grupos[data];
                return `
                    <div class="grupo-data">
                        <div class="cabecalho">
                            <span>${fmtData(data)}</span>
                            <span class="qtd">${itens.length} presente(s)</span>
                        </div>
                        <div class="lista">
                            ${itens.map(c => `
                                <div class="servo-item presente">
                                    <div class="avatar">${iniciais(c.servo_nome)}</div>
                                    <div class="info">
                                        <div class="nome">${c.servo_nome}</div>
                                        <div class="detalhe">${c.igreja} · ${(c.horario||'').slice(0,5)}</div>
                                    </div>
                                </div>`).join('')}
                        </div>
                    </div>`;
            }).join('');
        }

        (async function init() {
            sessao = await protegerPagina(['admin', 'lider', 'servo']);
            if (!sessao) return;

            const hoje = new Date();
            document.getElementById('dataHoje').textContent =
                hoje.toLocaleDateString('pt-BR', { weekday: 'long', day: '2-digit', month: 'long' });

            if (sessao.perfil === 'admin' || sessao.perfil === 'lider') {
                document.getElementById('areaGestao').style.display = 'block';
                try { servos = await API.listarServos(); } catch (e) { feedback(e.message, 'error'); }

                // Filtro de igreja só para admin
                if (sessao.perfil === 'admin') {
                    const box = document.getElementById('filtroIgrejaBox');
                    box.style.display = 'block';
                    try {
                        const igrejas = await API.listarIgrejas();
                        const sel = document.getElementById('filtroIgreja');
                        igrejas.forEach(ig => {
                            const o = document.createElement('option');
                            o.value = ig.nome; o.textContent = ig.nome;
                            sel.appendChild(o);
                        });
                        sel.addEventListener('change', async () => {
                            await recarregarHoje();
                            if (document.querySelector('.tab.active')?.dataset.tab === 'historico') carregarHistorico();
                        });
                    } catch (e) { /* silencioso */ }
                }
            }

            // Filtros de data do histórico
            document.getElementById('histInicio').addEventListener('change', carregarHistorico);
            document.getElementById('histFim').addEventListener('change', carregarHistorico);

            await recarregarHoje();
        })();
    </script>

</body>
</html>
